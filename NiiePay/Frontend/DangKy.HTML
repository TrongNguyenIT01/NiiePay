<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NiiePay - Đăng ký tài khoản</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            padding: 40px;
        }

        .register-container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
        }

        h2 {
            text-align: center;
            color: #2c3e50;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
            color: #34495e;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        .error-msg {
            color: #e74c3c;
            font-size: 0.85em;
            margin-top: 5px;
            display: block;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

            button:hover {
                background-color: #2ecc71;
            }

        .alert {
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 5px;
            display: none;
        }

        .alert-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-danger {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>

    <div class="register-container">
        <h2>Mở Tài Khoản NiiePay</h2>

        <!-- Khung hiển thị thông báo -->
        <div id="alertBox" class="alert"></div>

        <form id="registerForm">
            <div class="form-group">
                <label>Mã ngân hàng (VD: VCB, TCB):</label>
                <input type="text" id="MaNganHang" placeholder="Nhập mã ngân hàng">
                <span class="error-msg" id="err-MaNganHang"></span>
            </div>

            <div class="form-group">
                <label>Số tài khoản:</label>
                <input type="text" id="SoTaiKhoan" placeholder="Nhập số tài khoản">
                <span class="error-msg" id="err-SoTaiKhoan"></span>
            </div>

            <div class="form-group">
                <label>Họ tên chủ thẻ:</label>
                <input type="text" id="HoTenChuThe" placeholder="NHAP HO TEN KHONG DAU">
                <span class="error-msg" id="err-HoTenChuThe"></span>
            </div>

            <div class="form-group">
                <label>Số điện thoại:</label>
                <input type="text" id="SoDienThoai" placeholder="Nhập số điện thoại">
                <span class="error-msg" id="err-SoDienThoai"></span>
            </div>

            <div class="form-group">
                <label>Số CCCD:</label>
                <input type="text" id="CCCD" placeholder="Nhập số căn cước công dân">
                <span class="error-msg" id="err-CCCD"></span>
            </div>

            <div class="form-group">
                <label>Ngày hết hạn (Tuỳ chọn):</label>
                <input type="date" id="NgayHetHan">
            </div>

            <div class="form-group">
                <label>Số dư ban đầu (VNĐ):</label>
                <input type="number" id="SoDuBanDau" value="50000" min="0">
                <span class="error-msg" id="err-SoDuBanDau"></span>
            </div>

            <button type="submit" id="btnSubmit">ĐĂNG KÝ</button>
        </form>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            // 1. Reset các thông báo lỗi cũ
            document.querySelectorAll('.error-msg').forEach(el => el.innerText = '');
            const alertBox = document.getElementById('alertBox');
            alertBox.style.display = 'none';
            alertBox.className = 'alert';

            // 2. Gom dữ liệu từ Form gửi lên (Key phải khớp chính xác với class DangKy trong C#)
            const payload = {
                MaNganHang: document.getElementById('MaNganHang').value.trim(),
                SoTaiKhoan: document.getElementById('SoTaiKhoan').value.trim(),
                HoTenChuThe: document.getElementById('HoTenChuThe').value.trim(),
                SoDienThoai: document.getElementById('SoDienThoai').value.trim(),
                CCCD: document.getElementById('CCCD').value.trim(),
                NgayHetHan: document.getElementById('NgayHetHan').value ? document.getElementById('NgayHetHan').value : null,
                SoDuBanDau: parseFloat(document.getElementById('SoDuBanDau').value) || 0
            };

            try {
                // Đảm bảo URL này gọi đúng port đang chạy BE của bạn (3000)
                const response = await fetch('https://localhost:3001/api/DangKy/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                // 3. Xử lý kết quả trả về
                if (response.ok) {
                    // Status 200 - Rơi vào logic của Controller (Có thể SUCCESS hoặc FAIL)
                    if (data.status === "SUCCESS") {
                        alertBox.style.display = 'block';
                        alertBox.classList.add('alert-success');
                        alertBox.innerHTML = `<strong>Thành công!</strong> ${data.message} <br/> STK: ${data.soTaiKhoan}`;
                        document.getElementById('registerForm').reset(); // Xóa trắng form
                    } else {
                        // Trả về 200 nhưng logic bị FAIL (Trùng STK, thiếu số dư...)
                        alertBox.style.display = 'block';
                        alertBox.classList.add('alert-danger');
                        alertBox.innerHTML = `<strong>Thất bại:</strong> ${data.message}`;
                    }
                }
                else if (response.status === 400) {
                    // Status 400 - Bị chặn từ ngoài cửa do vi phạm [Required] của C#
                    if (data.errors) {
                        // Map lỗi tương ứng vào từng ô input
                        if (data.errors.MaNganHang) document.getElementById('err-MaNganHang').innerText = data.errors.MaNganHang[0];
                        if (data.errors.SoTaiKhoan) document.getElementById('err-SoTaiKhoan').innerText = data.errors.SoTaiKhoan[0];
                        if (data.errors.HoTenChuThe) document.getElementById('err-HoTenChuThe').innerText = data.errors.HoTenChuThe[0];
                        if (data.errors.SoDienThoai) document.getElementById('err-SoDienThoai').innerText = data.errors.SoDienThoai[0];
                        if (data.errors.CCCD) document.getElementById('err-CCCD').innerText = data.errors.CCCD[0];
                    }

                    alertBox.style.display = 'block';
                    alertBox.classList.add('alert-danger');
                    alertBox.innerHTML = "<strong>Lỗi dữ liệu:</strong> Vui lòng kiểm tra lại các trường màu đỏ!";
                }
            } catch (error) {
                console.error("Fetch error:", error);
                alertBox.style.display = 'block';
                alertBox.classList.add('alert-danger');
                alertBox.innerHTML = "<strong>Lỗi kết nối:</strong> Không thể kết nối đến máy chủ API (Kiểm tra lại port hoặc CORS).";
            }
        });
    </script>
</body>
</html>
